# Environnement local Loopa : docker compose -f infra/docker-compose.yml up -d
name: loopa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loopa
      POSTGRES_USER: loopa
      POSTGRES_PASSWORD: loopa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loopa
      MINIO_ROOT_PASSWORD: loopa-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: ["full"]          # docker compose --profile full up : lance aussi l'API
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOOPA_DB_URL: jdbc:postgresql://postgres:5432/loopa
      LOOPA_REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
